name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }} / ${{ matrix.llm-provider }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        llm-provider: [anthropic, none]
        include:
          - os: ubuntu-latest
            llm-provider: ollama

    env:
      LLM_PROVIDER: ${{ matrix.llm-provider }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Ollama runtime
        if: matrix.llm-provider == 'ollama'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          until curl -sf http://127.0.0.1:11434/api/tags >/dev/null; do sleep 1; done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  security-static-check:
    name: security-static-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static security check
        run: pnpm security:static-check

  release-gate:
    name: release-gate / deterministic and browser
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release gate
        run: |
          pnpm build
          pnpm test:no-llm
          pnpm security:static-check
          pnpm --filter @yantra/protocol verify

  browser-migration:
    name: browser-migration / ${{ matrix.os }} / no-llm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      LLM_PROVIDER: none
      YANTRA_E2E_BROWSER: '1'
      YANTRA_MIGRATION_SUITE_REQUIRED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build browser migration bundles
        run: |
          pnpm --filter @yantra/core build
          pnpm --filter @yantra/core build:recorder-overlay

      - name: Provision fixed Chrome for Testing fixture
        working-directory: packages/core
        run: pnpm exec tsx tests/helpers/provision-test-browser.ts

      - name: Run managed Stable installation smoke
        working-directory: packages/core
        env:
          YANTRA_E2E_MANAGED_INSTALL: '1'
        run: pnpm exec vitest run tests/browser/managed-install-live.spec.ts

      - name: Report driver, browser, and platform identity
        run: node -e "const fs=require('node:fs'); const core=require('./packages/core/package.json'); const browser=JSON.parse(fs.readFileSync(process.env.YANTRA_TEST_BROWSER_MANIFEST,'utf8')); console.log(JSON.stringify({puppeteer:core.dependencies['puppeteer-core'],...browser}))"

      - name: Run migration browser suites (Linux headful via Xvfb)
        if: runner.os == 'Linux'
        working-directory: packages/core
        run: >-
          xvfb-run -a pnpm exec vitest run
          tests/browser/migration-harness.spec.ts tests/browser/integration.spec.ts
          tests/browser/agent-controller.spec.ts tests/browser/agent-popup-policy.spec.ts
          tests/browser/set-of-marks.spec.ts tests/discovery/composed-handles.spec.ts
          tests/locator/injected-host.spec.ts tests/locator/frame-tokens.spec.ts
          tests/executor/input-characterization-browser.spec.ts
          tests/executor/step-handlers/input-migration.spec.ts
          tests/executor/replay-page-settling.spec.ts
          tests/workflow/recorder/popup-handler.spec.ts
          tests/workflow/recorder/recording-browser.spec.ts

      - name: Run migration browser suites
        if: runner.os != 'Linux'
        working-directory: packages/core
        run: >-
          pnpm exec vitest run
          tests/browser/migration-harness.spec.ts tests/browser/integration.spec.ts
          tests/browser/agent-controller.spec.ts tests/browser/agent-popup-policy.spec.ts
          tests/browser/set-of-marks.spec.ts tests/discovery/composed-handles.spec.ts
          tests/locator/injected-host.spec.ts tests/locator/frame-tokens.spec.ts
          tests/executor/input-characterization-browser.spec.ts
          tests/executor/step-handlers/input-migration.spec.ts
          tests/executor/replay-page-settling.spec.ts
          tests/workflow/recorder/popup-handler.spec.ts
          tests/workflow/recorder/recording-browser.spec.ts

  live-provider-smoke:
    name: release-gate / live provider smoke
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YANTRA_RUN_LIVE_AGENT_E2E: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run live agent smoke
        if: env.ANTHROPIC_API_KEY != ''
        run: pnpm --filter @yantra/e2e test -- agent-do.spec.ts

      - name: Report unconfigured live smoke
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "Live provider smoke is opt-in; ANTHROPIC_API_KEY is not configured."
