# Packaged production defaults for per-host sanitizer overrides.
# MUST stay in sync (same entries, same order) with DEFAULT_HOST_OVERRIDES in
# host-overrides.ts — the in-process sanitizer uses the constant while the file
# store falls back to this YAML when no user config exists.
version: 1
