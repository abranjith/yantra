<!-- page fixture "microdata-product": one schema.org Product expressed as microdata, with a nested Offer whose seller is a nested Organization. Provenance: FEAT-051 TASK-003 (microdata is the second schema.org syntax). -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Camp stove</title>
  </head>
  <body>
    <main>
      <div itemscope itemtype="https://schema.org/Product">
        <h1 itemprop="name">Two-burner camp stove</h1>
        <p>Color: <span itemprop="color">Forest Green</span></p>
        <meta itemprop="sku" content="CS-2B" />
        <div itemprop="offers" itemscope itemtype="https://schema.org/Offer">
          <span itemprop="price" content="84.95">$84.95</span>
          <meta itemprop="priceCurrency" content="USD" />
          <div itemprop="seller" itemscope itemtype="https://schema.org/Organization">
            <span itemprop="name">Trailhead Supply</span>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
