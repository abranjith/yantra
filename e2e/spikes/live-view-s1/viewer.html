<!doctype html>
<!--
  Spike S1 viewer (FEAT-069 TASK-001). Paints relayed screencast frames on a
  canvas under four glass panels, the way the Mission cockpit will.

  Query parameters (set by run-spike.ts):
    ws       WebSocket URL of the harness relay
    surfaces glass | solid
    glass    JSON {tint:[r,g,b], text:[r,g,b], alpha, blurPx, saturate} (0..1 channels),
             derived from the FEAT-061 tokens, so the panels use the shipped scrim floor.

  Protocol: each binary message is one JPEG. The viewer decodes it with
  createImageBitmap, draws it, records the draw time, then sends the text
  "ack" — the relay holds one frame (latest wins) until that ack (plan §6).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spike S1 viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .panel {
        position: absolute;
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 14px;
        line-height: 1.4;
        isolation: isolate;
        background-color: var(--tint);
        backdrop-filter: blur(var(--blur)) saturate(var(--saturate));
        border: 1px solid rgb(255 255 255 / 0.2);
        box-shadow:
          0 1px 2px rgb(0 0 0 / 0.12),
          0 8px 24px rgb(0 0 0 / 0.16);
        color: var(--ink);
      }
      [data-surfaces='solid'] .panel {
        background-color: var(--solid);
        backdrop-filter: none;
        box-shadow: none;
      }
      #p1 {
        top: 16px;
        left: 16px;
        width: 280px;
        height: 120px;
      }
      #p2 {
        top: 16px;
        right: 16px;
        width: 220px;
        height: 220px;
      }
      #p3 {
        bottom: 16px;
        left: 16px;
        right: 260px;
        height: 96px;
      }
      #p4 {
        bottom: 16px;
        right: 16px;
        width: 220px;
        height: 180px;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="1280" height="800"></canvas>
    <div class="panel" id="p1">Bindu · Running · step 4 of 9</div>
    <div class="panel" id="p2">ContractRing — 3 of 5 terms met</div>
    <div class="panel" id="p3">
      RunTimeline — navigated to example.test, filled the search field
    </div>
    <div class="panel" id="p4">BudgetGauge — 41 % of navigations</div>
    <script>
      const params = new URLSearchParams(location.search);
      const glass = JSON.parse(params.get('glass'));
      const css = (rgb, a) => `rgb(${rgb.map((c) => Math.round(c * 255)).join(' ')} / ${a})`;
      const root = document.documentElement;
      root.dataset.surfaces = params.get('surfaces') ?? 'glass';
      root.style.setProperty('--tint', css(glass.tint, glass.alpha));
      root.style.setProperty('--solid', css(glass.tint, 1));
      root.style.setProperty('--ink', css(glass.text, 1));
      root.style.setProperty('--blur', `${glass.blurPx}px`);
      root.style.setProperty('--saturate', String(glass.saturate));

      const canvas = document.getElementById('screen');
      const context = canvas.getContext('2d');
      /** Draw timestamps (performance.now(), ms) and rAF timestamps, read by the harness. */
      window.__spike = { draws: [], rafs: [], decodeMs: [] };

      (function tick(now) {
        window.__spike.rafs.push(now);
        requestAnimationFrame(tick);
      })(performance.now());

      const socket = new WebSocket(params.get('ws'));
      socket.binaryType = 'arraybuffer';
      socket.onmessage = async (message) => {
        if (typeof message.data === 'string') return;
        const started = performance.now();
        const bitmap = await createImageBitmap(new Blob([message.data], { type: 'image/jpeg' }));
        if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
        }
        context.drawImage(bitmap, 0, 0);
        bitmap.close();
        const drawn = performance.now();
        window.__spike.draws.push(drawn);
        window.__spike.decodeMs.push(drawn - started);
        socket.send('ack');
      };
    </script>
  </body>
</html>
