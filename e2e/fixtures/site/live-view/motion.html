<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Live view motion fixture</title>
    <style>
      body {
        margin: 0;
        font:
          14px/1.4 Georgia,
          serif;
      }
      .hero {
        height: 200px;
        background: linear-gradient(90deg, #c33, #36c, #3a6, #c33);
        background-size: 400% 100%;
        animation: slide 3s linear infinite;
      }
      @keyframes slide {
        to {
          background-position: 400% 0;
        }
      }
      .spin {
        width: 80px;
        height: 80px;
        margin: 20px;
        background: #222;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="hero"></div>
    <div class="spin"></div>
    <p id="tick">0</p>
    <a id="next" href="/live-view/second.html">Next page</a>
    <script>
      let n = 0;
      setInterval(() => {
        document.getElementById('tick').textContent = String(n++);
      }, 50);
    </script>
  </body>
</html>
